name: Verify repository machinery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/selftest.py
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Lint shell scripts
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -e SC1007,SC1091,SC2016 scripts/*.sh

  apt-round-trip:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Bootstrap container action prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install APT publisher test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dpkg-dev gnupg python3 reprepro
      - name: Generate, publish, retry, and consume an APT repository
        run: bash scripts/test-publish-roundtrip.sh deb

  rpm-round-trip:
    runs-on: ubuntu-24.04
    container: almalinux:10
    steps:
      - name: Bootstrap container action prerequisites
        run: dnf -y install ca-certificates git-core
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install RPM publisher test tools
        run: dnf -y install createrepo_c gnupg2 python3 rpm-build rpm-sign
      - name: Generate, publish, retry, and consume an RPM repository
        run: bash scripts/test-publish-roundtrip.sh rpm
