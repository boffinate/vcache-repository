name: Publish repository site

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

# Shared with publish.yml so the site is never generated from a half-uploaded target.
concurrency:
  group: vcache-repository-publish
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish the browsable site
        env:
          REPOSITORY_PUBLIC_URL: ${{ secrets.REPOSITORY_PUBLIC_URL }}
          REPOSITORY_GPG_FINGERPRINT: ${{ secrets.REPOSITORY_GPG_FINGERPRINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/publish-site.sh
