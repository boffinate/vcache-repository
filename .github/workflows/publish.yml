name: Publish signed repositories

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Completed producer tag, for example vinyl-X.Y.Z-el10-x86_64"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: vcache-repository-publish
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    outputs:
      format: ${{ steps.route.outputs.format }}
      publisher: ${{ steps.route.outputs.publisher }}
      image: ${{ steps.route.outputs.image }}
      runner: ${{ steps.route.outputs.runner }}
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/selftest.py
      - name: Install RPM metadata validator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rpm
      - name: Fetch and validate release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/release
          scripts/fetch-release.sh "$SOURCE_TAG" work/release
      - name: Select native route
        id: route
        run: |
          IFS=$'\t' read -r _ _ format _ image platform < <(scripts/fetch-release.sh --describe work/release)
          case "$platform" in
            linux/amd64) runner=ubuntu-24.04 ;;
            linux/arm64) runner=ubuntu-24.04-arm ;;
            *) exit 2 ;;
          esac
          if [ "$format" = deb ]; then publisher=apt; else publisher=rpm; fi
          {
            echo "format=$format"
            echo "publisher=$publisher"
            echo "image=$image"
            echo "runner=$runner"
          } >> "$GITHUB_OUTPUT"
      - name: Transfer validated release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release
          path: work/release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: fetch
    runs-on: ${{ needs.fetch.outputs.runner }}
    container: ${{ needs.fetch.outputs.image }}
    environment:
      name: production
    steps:
      - name: Bootstrap container action prerequisites
        env:
          PACKAGE_FORMAT: ${{ needs.fetch.outputs.format }}
        run: |
          if [ "$PACKAGE_FORMAT" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
          else
            dnf -y install ca-certificates git-core
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download validated release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-release
          path: work/release
      - name: Install container publication tools
        env:
          PACKAGE_FORMAT: ${{ needs.fetch.outputs.format }}
        run: |
          if [ "$PACKAGE_FORMAT" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl diffutils gnupg python3 reprepro unzip
            awscli_version=2.33.0
            case "$(dpkg --print-architecture)" in
              amd64)
                awscli_arch=x86_64
                awscli_sha256=db9001fd76d322a2ce9c88b5e1f306c449137541c28d04ca076f3afce366d35d
                ;;
              arm64)
                awscli_arch=aarch64
                awscli_sha256=317455780b0b3f88b34fd4112a34f98f02239340e3645437405a03750b132ffd
                ;;
              *)
                echo "unsupported Debian architecture for AWS CLI: $(dpkg --print-architecture)" >&2
                exit 2
                ;;
            esac
            curl --fail --location --silent --show-error --output /tmp/awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-${awscli_arch}-${awscli_version}.zip"
            if ! printf '%s  %s\n' "$awscli_sha256" /tmp/awscliv2.zip | sha256sum --check --status; then
              echo "AWS CLI archive checksum mismatch" >&2
              exit 2
            fi
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin
            case "$(aws --version 2>&1)" in
              aws-cli/2.33.0*) ;;
              *)
                echo "unexpected AWS CLI version" >&2
                exit 2
                ;;
            esac
          else
            dnf -y install awscli2 createrepo_c gnupg2 python3 rpm-sign
          fi
      - name: Recheck before secrets are used
        run: scripts/fetch-release.sh --verify work/release
      - name: Publish ordered repository tree
        env:
          REPOSITORY_GPG_PRIVATE_KEY_B64: ${{ secrets.REPOSITORY_GPG_PRIVATE_KEY_B64 }}
          REPOSITORY_GPG_FINGERPRINT: ${{ secrets.REPOSITORY_GPG_FINGERPRINT }}
          REPOSITORY_PUBLIC_URL: ${{ secrets.REPOSITORY_PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          scripts/publish-${{ needs.fetch.outputs.publisher }}.sh work/release
      # Runs in the publish job so it reuses the container's python3 and AWS CLI
      # and needs no second environment approval. A failure here fails the job
      # and skips smoke even though the repository publish succeeded; rerunning
      # the same source tag is idempotent and is the documented recovery.
      - name: Publish the browsable site
        env:
          REPOSITORY_PUBLIC_URL: ${{ secrets.REPOSITORY_PUBLIC_URL }}
          REPOSITORY_GPG_FINGERPRINT: ${{ secrets.REPOSITORY_GPG_FINGERPRINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/publish-site.sh

  smoke:
    needs: [fetch, publish]
    runs-on: ${{ needs.fetch.outputs.runner }}
    env:
      REPOSITORY_PUBLIC_URL: ${{ vars.REPOSITORY_PUBLIC_URL }}
      REPOSITORY_GPG_FINGERPRINT: ${{ vars.REPOSITORY_GPG_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download validated release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-release
          path: work/release
      - name: Smoke the native public repository
        run: |
          scripts/smoke-${{ needs.fetch.outputs.publisher }}.sh work/release "$REPOSITORY_PUBLIC_URL"
